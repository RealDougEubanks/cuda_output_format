# CodeQL static analysis for Python. Complements bandit/pip-audit with
# data-flow analysis. Findings appear under the repo's Security tab.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 14 * * 1"  # Mondays 14:00 UTC, an hour after security-scan.

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Initialize CodeQL
        uses: github/codeql-action/init@87557b9c84dde89fdd9b10e88954ac2f4248e463 # v3.27.4
        with:
          languages: python
          # Exclude vendored upstream code from scanning.
          config: |
            paths-ignore:
              - lib/ffmpeg/**

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@87557b9c84dde89fdd9b10e88954ac2f4248e463 # v3.27.4
