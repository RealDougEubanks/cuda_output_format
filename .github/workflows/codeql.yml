# CodeQL static analysis for Python. Complements bandit/pip-audit with
# data-flow analysis. Findings appear under the repo's Security tab.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 14 * * 1"  # Mondays 14:00 UTC, an hour after security-scan.

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v3.27.4
        with:
          languages: python
          # Exclude vendored upstream code from scanning.
          config: |
            paths-ignore:
              - lib/ffmpeg/**

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v3.27.4
