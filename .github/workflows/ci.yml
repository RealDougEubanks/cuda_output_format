# Triggers on `pull_request` (not `pull_request_target`) by design —
# fork PRs must never receive write-scoped secrets. Do not change this
# without a security review.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.1.1
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Run tests
        run: pytest

      - name: Audit dev dependencies (pip-audit)
        run: pip-audit -r requirements-dev.txt --strict
