[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["lib/ffmpeg"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "RUF012"]
# Unmanic's PluginSettings expects a class-level `settings` dict; mirroring
# that pattern is the documented plugin API, so RUF012 is suppressed here.
"plugin.py" = ["RUF012"]
"settings.py" = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
